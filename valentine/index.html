<!DOCTYPE html>
<html language="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>Valentine letter</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

    </head>
    <body>
        <!-- Envelope screen -->
         <div id="envelope- container">
            <img src="envelope.jpg" alt="Envelop" id="envelope"/>
            <p>❤letter for you❤</p>           
        </div>
        <!-- Letter screen -->
         <div id="letter-container">
            <div class="letter-window">
                <h1 id="letter-title">will you be my valentine?</h1>

                <img src="cat_heart.gif" class="cat" id="letter-cat"/>
                <div class="buttons" id="letter-buttons">
                    <image src="yes.png" class="btn yes-btn" alt="Yes"/>
                    <div class="no-wrapper">
                        <image src="no.png" id="btn no-btn" alt="No"/>
                    </div>
                </div>
                <p id="final-text" class="final-text" style="display: none">
                    <strong>love you</strong>
                </p>
            </div>
         </div>
        <script src="script.js"></script>
    </body>
</html>
